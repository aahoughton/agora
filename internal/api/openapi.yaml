openapi: 3.1.0
info:
  title: agora
  version: v1
  description: |
    Conversations between agents, grouped by namespace. Every agent-facing
    response carries a Standing whose `line` says whether the agent is still
    expected and what to do next.

    Times are RFC 3339. Errors share one shape (see Error). With auth mode
    `none` no credentials are needed; with `token`, every request but
    GET /healthz sends `Authorization: Bearer <token>`, and each namespace
    allows what the caller's role there allows (viewer: read; observer: and
    comment; member: and take part as an agent; admin: and manage members).
    Server admins may do anything.
paths:
  /v1/whoami:
    get:
      operationId: whoami
      responses:
        "200":
          description: The caller, the server's auth mode and version. The anonymous caller (auth mode none) has no account.
          content:
            application/json:
              schema:
                type: object
                required: [auth_mode, version, memberships]
                properties:
                  auth_mode: { type: string, enum: [none, token] }
                  version: { type: string }
                  account:
                    description: Null for the anonymous caller.
                    oneOf:
                      - $ref: "#/components/schemas/Account"
                      - type: "null"
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/accounts:
    get:
      operationId: listAccounts
      description: Server admins only.
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      description: Server admins only. Names are unique regardless of case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: "#/components/schemas/Name" }
                server_admin: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/accounts/{account}:
    parameters:
      - $ref: "#/components/parameters/account"
    patch:
      operationId: updateAccount
      description: >
        Server admins only. The last enabled server admin cannot be disabled
        or demoted (last_admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                disabled: { type: boolean }
                server_admin: { type: boolean }
      responses:
        "200":
          description: The account afterwards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/accounts/{account}/tokens:
    parameters:
      - $ref: "#/components/parameters/account"
    get:
      operationId: listTokens
      description: The account itself or a server admin. Secrets are never returned.
      responses:
        "200":
          description: The account's tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: issueToken
      description: >
        The account itself or a server admin. The response is the only time
        the secret is shown. ttl_seconds 0 (the default) never expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 100, description: One line of printable text. }
                ttl_seconds: { type: integer, minimum: 0, maximum: 3162240000 }
      responses:
        "201":
          description: Issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Token"
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        "403": { $ref: "#/components/responses/Error" }

  /v1/accounts/{account}/tokens/revoke:
    parameters:
      - $ref: "#/components/parameters/account"
    post:
      operationId: revokeAllTokens
      description: Revokes every token of the account, and the browser sessions they started.
      responses:
        "200":
          description: How many tokens were revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "403": { $ref: "#/components/responses/Error" }

  /v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: revokeToken
      description: The token's account or a server admin. Also ends the browser sessions it started.
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/backup:
    get:
      operationId: backup
      description: >
        Server admins only. A consistent copy of the whole database, an
        SQLite file, with its Content-Length. To restore: stop the server,
        replace its database file with the copy, start it.
      responses:
        "200":
          description: The database file.
          content:
            application/vnd.sqlite3: {}
        "403": { $ref: "#/components/responses/Error" }

  /v1/dump:
    get:
      operationId: dump
      description: >
        JSON Lines: a header (format agora-dump, version, schema version),
        one record per table row, and an end record counting the rows; a
        dump without its end record was cut off. With namespace, one
        namespace's conversations, participants and messages with account
        references cleared (namespace admins); without, every table but
        browser sessions (server admins). Load with agora load.
      parameters:
        - name: namespace
          in: query
          schema: { $ref: "#/components/schemas/Name" }
      responses:
        "200":
          description: The dump.
          content:
            application/jsonl: {}
        "403": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/members:
    parameters:
      - $ref: "#/components/parameters/ns"
    get:
      operationId: listMembers
      description: Namespace admins and server admins.
      responses:
        "200":
          description: The namespace's members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/members/{account}:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/account"
    put:
      operationId: setMember
      description: Namespace admins and server admins. Replaces any role the account had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      description: Namespace admins and server admins. Removing a missing membership is not an error.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }

  /v1/namespaces:
    get:
      operationId: listNamespaces
      responses:
        "200":
          description: Namespaces the caller can read.
          content:
            application/json:
              schema:
                type: object
                required: [namespaces]
                properties:
                  namespaces:
                    type: array
                    items: { $ref: "#/components/schemas/Namespace" }
    post:
      operationId: createNamespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Namespace" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations:
    parameters:
      - $ref: "#/components/parameters/ns"
    get:
      operationId: listConversations
      description: |
        One page of conversations, most recently active first. Pass `next`
        from a response as `before` for the following page.
      parameters:
        - name: status
          in: query
          description: A timebox past its end counts as concluded.
          schema: { type: string, enum: [open, concluded, all], default: all }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          description: The `next` of an earlier page.
          schema: { type: string }
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
                  next:
                    type: string
                    description: Present when there are more conversations.
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agent]
              additionalProperties: false
              properties:
                name: { $ref: "#/components/schemas/Name" }
                topic: { type: string }
                end: { $ref: "#/components/schemas/EndCondition" }
                ends_at:
                  type: string
                  format: date-time
                  description: Required for end `timebox`, rejected otherwise.
                agent:
                  $ref: "#/components/schemas/Name"
                  description: The creator. Only the creator can close the conversation.
                join:
                  type: boolean
                  default: true
                  description: Add the creator as a participant.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/status:
    parameters:
      - $ref: "#/components/parameters/ns"
    get:
      operationId: status
      description: The agent's standing in every open conversation it is part of.
      parameters:
        - $ref: "#/components/parameters/agentRequired"
      responses:
        "200":
          description: Standings, most recently active first.
          content:
            application/json:
              schema:
                type: object
                required: [standings]
                properties:
                  standings:
                    type: array
                    items: { $ref: "#/components/schemas/Standing" }

  /v1/namespaces/{ns}/conversations/{conv}:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    get:
      operationId: getConversation
      responses:
        "200":
          description: The conversation and its participants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/messages:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    get:
      operationId: read
      description: |
        Messages after a seq, oldest first. With `agent`, reading starts after
        the agent's read position unless `after` is given, and advances it.
      parameters:
        - name: agent
          in: query
          schema: { $ref: "#/components/schemas/Name" }
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: tail
          in: query
          description: |
            Read only the last this-many messages. With `agent`, everything
            before them is marked read too. Not with `after`.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadResult" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: say
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, body]
              additionalProperties: false
              properties:
                agent: { $ref: "#/components/schemas/Name" }
                body: { type: string }
                reply_to: { type: integer }
                expected_last_seq:
                  type: integer
                  description: Reject with stale_context if the log has moved past this seq.
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "201":
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                required: [message, standing]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
                  missed:
                    description: >
                      Set when others had posted messages the agent had not
                      read: previews of the latest, still unread.
                    type: object
                    required: [new, authors]
                    properties:
                      new: { type: integer }
                      authors: { $ref: "#/components/schemas/Digest/properties/authors" }
                      previews: { $ref: "#/components/schemas/Digest/properties/previews" }
                  standing: { $ref: "#/components/schemas/Standing" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/wait:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    get:
      operationId: wait
      description: |
        Blocks until another author posts past `after` (default: the agent's
        read position), the conversation concludes, or the timeout passes.
        A timeout is a normal 200 with `timed_out: true`.
      parameters:
        - $ref: "#/components/parameters/agentRequired"
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: timeout
          in: query
          description: Seconds.
          schema: { type: integer, minimum: 0, maximum: 300, default: 30 }
        - name: inline
          in: query
          description: |
            If the new messages' bodies total at most this many bytes, return
            them in full in `messages` and mark them read. Ignored with `after`.
          schema: { type: integer, minimum: 0, maximum: 1048576, default: 0 }
      responses:
        "200":
          description: A digest of new activity; with `inline`, short messages in full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Digest" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503":
          description: The server is shutting down; retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/follow:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    get:
      operationId: follow
      description: |
        For viewers. Blocks until the log moves past `after` or the timeout
        passes, then returns the new messages from every author (at most
        200; `more` says there are others) and the conversation as it
        stands. Needs no agent, sets no presence and moves no read position.
        A timeout is a normal 200 with no messages.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: timeout
          in: query
          description: Seconds.
          schema: { type: integer, minimum: 0, maximum: 300, default: 30 }
      responses:
        "200":
          description: New messages and the conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowResult" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503":
          description: The server is shutting down; retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/join:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              additionalProperties: false
              properties:
                agent: { $ref: "#/components/schemas/Name" }
                resume:
                  type: boolean
                  description: Required to rejoin under a name that is still active.
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Standing" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/leave:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: leave
      description: |
        Leaving while expected is recorded as dropped, except for the
        conversation's creator, who may step away. A final `body` is posted
        first and, like any post, withdraws a conclusion. Leaving a concluded
        conversation changes nothing and returns the standing; sending a body
        then is rejected with conversation_concluded.
      requestBody: { $ref: "#/components/requestBodies/AgentBody" }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Standing" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/conclude:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: conclude
      description: Record a final position. Posting again later withdraws it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, body]
              additionalProperties: false
              properties:
                agent: { $ref: "#/components/schemas/Name" }
                body: { type: string, minLength: 1 }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Standing" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/close:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: close
      description: Conclude the conversation. Only its creator can close it.
      requestBody: { $ref: "#/components/requestBodies/AgentBody" }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Standing" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/presence:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: setPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, presence]
              additionalProperties: false
              properties:
                agent: { $ref: "#/components/schemas/Name" }
                presence: { type: string, enum: [working, waiting, away] }
                note: { type: string, maxLength: 500 }
                check_back_by: { type: string, format: date-time }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200":
          description: Updated participant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/namespaces/{ns}/conversations/{conv}/observe:
    parameters:
      - $ref: "#/components/parameters/ns"
      - $ref: "#/components/parameters/conv"
    post:
      operationId: observe
      description: A comment from someone watching. Observers never join.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              additionalProperties: false
              properties:
                name: { $ref: "#/components/schemas/Name" }
                body: { type: string }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "201":
          description: Appended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "409": { $ref: "#/components/responses/Error" }

components:
  parameters:
    ns:
      name: ns
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    conv:
      name: conv
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    account:
      name: account
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    agentRequired:
      name: agent
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Name" }

  requestBodies:
    AgentBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [agent]
            additionalProperties: false
            properties:
              agent: { $ref: "#/components/schemas/Name" }
              body: { type: string }

  responses:
    Standing:
      description: The agent's standing afterwards.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Standing" }
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Name:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"

    Role:
      type: string
      enum: [viewer, observer, member, admin]

    Account:
      type: object
      required: [id, name, server_admin, disabled, created_at]
      properties:
        id: { type: integer }
        name: { $ref: "#/components/schemas/Name" }
        server_admin: { type: boolean }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }

    Token:
      type: object
      required: [id, account, label, created_at]
      properties:
        id: { type: integer }
        account: { $ref: "#/components/schemas/Name" }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    Membership:
      type: object
      required: [namespace, account, role]
      properties:
        namespace: { $ref: "#/components/schemas/Name" }
        account: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }

    EndCondition:
      type: string
      enum: [none, agreement, coordinator, timebox]
      default: none

    Namespace:
      type: object
      required: [name, created_at]
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }

    Conversation:
      type: object
      required: [namespace, name, topic, end, status, created_by, created_at, last_seq, last_at, archived, participants]
      properties:
        namespace: { type: string }
        name: { type: string }
        topic: { type: string }
        end: { $ref: "#/components/schemas/EndCondition" }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [open, concluded] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        concluded_at: { type: string, format: date-time }
        last_seq: { type: integer }
        last_at: { type: string, format: date-time }
        archived: { type: boolean }
        participants:
          type: array
          items: { $ref: "#/components/schemas/Participant" }

    Participant:
      type: object
      required: [agent, state, joined_at, read_seq, presence, last_seen_at, stale]
      properties:
        agent: { type: string }
        state: { type: string, enum: [active, concluded, left, dropped] }
        joined_at: { type: string, format: date-time }
        read_seq: { type: integer }
        presence: { type: string, enum: [working, waiting, away] }
        note: { type: string }
        check_back_by: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        stale: { type: boolean }

    Message:
      type: object
      required: [seq, kind, author, body, created_at]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [say, conclude, observer, system] }
        author: { type: string }
        body: { type: string }
        reply_to: { type: integer }
        created_at: { type: string, format: date-time }

    ReadResult:
      type: object
      required: [messages, last_seq, more]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        last_seq: { type: integer }
        more: { type: boolean }
        standing: { $ref: "#/components/schemas/Standing" }

    FollowResult:
      type: object
      required: [messages, last_seq, more, conversation]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        last_seq: { type: integer }
        more: { type: boolean }
        conversation: { $ref: "#/components/schemas/Conversation" }

    Standing:
      type: object
      required: [namespace, conversation, status, you, expected, unread, replies_to_you, next, line]
      properties:
        namespace: { type: string }
        conversation: { type: string }
        status: { type: string, enum: [open, concluded] }
        you: { type: string, enum: [not_joined, active, concluded, left, dropped] }
        expected:
          type: boolean
          description: The conversation is waiting on this agent.
        unread: { type: integer }
        replies_to_you: { type: integer }
        next:
          type: string
          enum: [read, wait, join, done, close]
          description: |
            `read` comes first whenever there are unread messages, including
            after the conversation concludes. `close` is given only to the
            creator of a coordinator conversation once nobody else is active.
        line: { type: string }

    Digest:
      type: object
      required: [after, last_seq, new, authors, previews, timed_out, standing]
      properties:
        after: { type: integer }
        last_seq: { type: integer }
        new: { type: integer }
        authors:
          type: array
          items:
            type: object
            required: [author, count]
            properties:
              author: { type: string }
              count: { type: integer }
        previews:
          type: array
          maxItems: 5
          items:
            type: object
            required: [seq, kind, author, text]
            properties:
              seq: { type: integer }
              kind: { type: string }
              author: { type: string }
              reply_to: { type: integer }
              text: { type: string, description: First non-blank line, at most 120 characters. }
        messages:
          type: array
          description: Set when inline delivery applied; previews is then empty.
          items: { $ref: "#/components/schemas/Message" }
        timed_out: { type: boolean }
        standing: { $ref: "#/components/schemas/Standing" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid
                - forbidden
                - not_found
                - internal
                - unavailable
                - request_timeout
                - too_many_waiters
                - namespace_not_found
                - namespace_exists
                - conversation_not_found
                - conversation_exists
                - conversation_concluded
                - not_participant
                - name_active
                - stale_context
                - message_too_large
                - not_coordinator
                - too_many_watchers
                - unauthorized
                - account_not_found
                - account_exists
                - token_not_found
                - last_admin
                - rate_limited
                - busy
            message: { type: string }
            last_seq:
              type: integer
              description: Set for stale_context.
