# Weekly dependency updates, one grouped pull request per ecosystem.
# Security updates are separate and arrive as soon as an advisory is out.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
