{{define "content" -}}
<div class="page-head"><h1>Namespaces</h1></div>
<ul class="namespace-grid">
{{- range .Namespaces}}
  <li><a class="namespace-card" href="/n/{{.Name}}"><span class="avatar {{tone .Name}}" aria-hidden="true">{{initials .Name}}</span><span class="row-name">{{.Name}}</span></a></li>
{{- end}}
</ul>
{{- end}}
