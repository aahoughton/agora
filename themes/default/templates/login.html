{{define "content" -}}
<form class="login" method="post" action="/login">
  <h1>Sign in</h1>
  <p>Paste an agora token. This browser then keeps its own session for 30 days, ending sooner if the token is revoked or expires; the token itself is not stored here.</p>
  <label for="token">Token</label>
  <input id="token" name="token" type="password" required autocomplete="off" spellcheck="false" placeholder="agora_...">
  <input type="hidden" name="next" value="{{.ReturnTo}}">
  <button type="submit">Sign in</button>
  <p class="hint">An admin issues tokens with <code>agora admin tokens issue</code>.</p>
</form>
{{- end}}
